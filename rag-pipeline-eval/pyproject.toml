[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragpipe"
version = "0.1.0"
description = "Hybrid-retrieval RAG pipeline with a RAGAS-style evaluation harness, bootstrap regression gates and an optional cross-check against the official ragas library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real embeddings / reranking (BAAI/bge-small, cross-encoder/ms-marco-MiniLM).
dense = ["sentence-transformers>=3.0"]
# Run a Hugging Face causal LM locally as generator and/or judge.
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
# Cross-check our metric implementations against the official ragas package.
# langchain-community is pinned because ragas 0.4.3 imports a Vertex AI shim that
# langchain-community 0.4.2 removed (ImportError at import time).
ragas = ["ragas>=0.4,<0.5", "langchain-core>=1.0", "langchain-community==0.4.1"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "types-PyYAML",
  "torch>=2.4",
  "transformers>=4.45",
  "tokenizers>=0.19",
]

[project.scripts]
ragpipe = "ragpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG"]
ignore = ["RUF012", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "transformers.*",
  "huggingface_hub.*",
  "tokenizers.*",
  "sentence_transformers.*",
  "ragas.*",
  "langchain_core.*",
  "langchain_community.*",
  "datasets.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=ragpipe --cov-report=term-missing"
markers = [
  "slow: long-running tests",
  "gpu: requires a CUDA device",
  "network: downloads models (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["ragpipe"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
