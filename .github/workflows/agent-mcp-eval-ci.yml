name: CI · agent-mcp-eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agent-mcp-eval/**", ".github/workflows/agent-mcp-eval-ci.yml"]
  pull_request:
    paths: ["agent-mcp-eval/**", ".github/workflows/agent-mcp-eval-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agent-mcp-eval

jobs:
  quality:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"          # tests must never download models
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent-mcp-eval/pyproject.toml

      # No PyTorch here on purpose: the scripted chat model makes the whole benchmark
      # runnable without a model, so CI stays a two-minute job.
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

      - name: Verify committed v2 model evidence without inference
        # Uses raw committed bytes and trajectory regrading; no torch, model load,
        # network request or paid API. Historical v1 requires its own source commit.
        run: |
          python -m mcpeval.bench.live_v2 --verify --out docs/experiments/local-live-v2/qwen15
          python -m mcpeval.bench.live_v2 --verify --out docs/experiments/local-live-v2/qwen4b
          python -m mcpeval.bench.live_v2 --compare docs/experiments/local-live-v2/qwen15 docs/experiments/local-live-v2/qwen4b --out runs/ci-live-v2-comparison
          diff docs/experiments/local-live-v2/comparison/comparison.json runs/ci-live-v2-comparison/comparison.json
          diff docs/experiments/local-live-v2/comparison/comparison.md runs/ci-live-v2-comparison/comparison.md

      - name: Harness regression gate and research comparison
        # Fail on changed per-task scripted outcomes. HOLD in the separate architecture
        # comparison is a valid research finding, not a harness regression.
        run: make gate

      - name: MCP protocol smoke test (real stdio transport)
        # Proves the server is a real MCP server, not just a set of Python functions:
        # this launches it as a subprocess and speaks the protocol to it.
        run: mcpeval tools list --transport stdio

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: agent-mcp-eval/coverage.xml
          if-no-files-found: ignore
