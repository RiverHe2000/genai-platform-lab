name: CI · rag-pipeline-eval

on:
  push:
    branches: [main]
    paths: ["rag-pipeline-eval/**", ".github/workflows/rag-pipeline-eval-ci.yml"]
  pull_request:
    paths: ["rag-pipeline-eval/**", ".github/workflows/rag-pipeline-eval-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rag-pipeline-eval

jobs:
  quality:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"          # tests must never download models
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: rag-pipeline-eval/pyproject.toml

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

      - name: Evaluation gate on the committed fake-LLM smoke run
        # Proves the gate wiring end-to-end without a model: ingest, evaluate with the
        # deterministic FakeLLM, then fail the job if retrieval quality regresses.
        run: |
          ragpipe ingest --corpus corpus --index /tmp/index --embedder hash
          ragpipe eval --index /tmp/index --evalset evalsets/policy_qa.jsonl --out /tmp/run \
            --generator fake --judge fake --metrics retrieval,lexical
          ragpipe gate --report /tmp/run/report.json --gates gates/retrieval_smoke.yaml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: rag-pipeline-eval/coverage.xml
          if-no-files-found: ignore
