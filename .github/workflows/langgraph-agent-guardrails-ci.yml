name: CI · langgraph-agent-guardrails

on:
  push:
    branches: [main]
    paths: ["langgraph-agent-guardrails/**", ".github/workflows/langgraph-agent-guardrails-ci.yml"]
  pull_request:
    paths: ["langgraph-agent-guardrails/**", ".github/workflows/langgraph-agent-guardrails-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: langgraph-agent-guardrails

jobs:
  quality:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"          # tests must never download models
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: langgraph-agent-guardrails/pyproject.toml

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

      - name: Red-team gate (deterministic, scripted model)
        # Every adversarial scenario must be caught by the guardrails regardless of the
        # model, so this runs with the scripted FakeChatModel and fails the build otherwise.
        run: agentguard eval --scenarios scenarios/redteam.jsonl --model fake --out /tmp/redteam --gate

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: langgraph-agent-guardrails/coverage.xml
          if-no-files-found: ignore
