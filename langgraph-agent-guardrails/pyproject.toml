[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "A LangGraph tool-using agent for a bank's credit-policy desk with layered guardrails, human-in-the-loop approval, durable checkpoints, an audit trail and a red-team evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "River He" }]
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "fastapi>=0.115",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Run a Hugging Face chat model in-process as the agent's brain.
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
serve = ["uvicorn[standard]>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "types-PyYAML",
  "torch>=2.4",
  "transformers>=4.45",
  "tokenizers>=0.19",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentguard = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG", "ASYNC"]
ignore = ["RUF012", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "langgraph.*",
  "langchain_core.*",
  "transformers.*",
  "huggingface_hub.*",
  "tokenizers.*",
  "uvicorn.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=agentguard --cov-report=term-missing"
markers = [
  "slow: long-running tests",
  "gpu: requires a CUDA device",
  "network: downloads models (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["agentguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
