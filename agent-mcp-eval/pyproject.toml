[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpeval"
version = "0.1.0"
description = "A Model Context Protocol tool server for a wealth platform, a supervisor multi-agent system that consumes it under a permission policy, and a long-horizon benchmark that scores trajectories rather than final answers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "mcp>=2.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anyio>=4.4",
]

[project.optional-dependencies]
# Run a Hugging Face chat model in-process as the agents' brain.
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "hypothesis>=6.100",
]

[project.scripts]
mcpeval = "mcpeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpeval = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG", "ASYNC"]
ignore = ["RUF012", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001", "SLF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "langgraph.*",
  "langchain_core.*",
  "transformers.*",
  "huggingface_hub.*",
  "tokenizers.*",
  "torch.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=mcpeval --cov-report=term-missing"
markers = [
  "slow: long-running tests",
  "gpu: requires a CUDA device",
  "network: downloads models (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["mcpeval"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
